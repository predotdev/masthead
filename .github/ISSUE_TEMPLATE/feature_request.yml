name: Feature request
description: Something Masthead should do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. Screens, settings or commands are all fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this.
