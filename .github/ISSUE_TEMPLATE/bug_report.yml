name: Bug report
description: Something does not work the way the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out subscriber data, API keys and tokens. Security problems go through the Security tab (Report a vulnerability), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. bun run dev and bun run seed
        2. Open the admin and ...
        3. See ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Masthead commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - Local (bun run dev)
        - Cloudflare Workers, workers.dev address
        - Cloudflare Workers, custom domain or route
        - Behind my own proxy
        - Static build (masthead build)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors and logs
      description: Browser console errors, `wrangler tail` or `wrangler dev` output, CLI output.
      render: text
  - type: input
    id: browser
    attributes:
      label: Browser and OS, for admin or theme bugs
