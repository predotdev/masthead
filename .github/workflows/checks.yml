name: checks

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request supersedes the running check.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: pull requests from forks run this too once the repository is public.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run --cwd packages/admin build

      # Credential patterns, plus a private denylist kept in a repository secret.
      - run: bun scripts/leak-guard.ts
        env:
          MASTHEAD_DENYLIST: ${{ secrets.MASTHEAD_DENYLIST }}

      # Full history scan, so a secret committed and later deleted still fails.
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact --config .gitleaks.toml
