# Copy to wrangler.toml and fill in your own ids (git ignores that copy, since it
# names your account's resources). Every setting: docs/configuration.md.
name = "masthead"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Every minute: scheduled posts, newsletter batches, and the nightly backup to R2 (02:30 UTC).
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "masthead"
database_id = "<your D1 database id>"

# Optional: resized copies of uploaded images for srcset (Cloudflare Images binding).
# [images]
# binding = "IMAGES"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "masthead"

# The admin app, built by `bun run --cwd packages/admin build` into ../../packages/admin/dist.
[assets]
directory = "../../packages/admin/dist"
binding = "ASSETS"
run_worker_first = true
# The Worker maps <base>admin/... onto these files itself.
html_handling = "none"
not_found_handling = "none"

[vars]
SITE_URL = "https://example.com/blog/"
EMAIL_FROM = "Example <news@example.com>"
# Until you switch traffic, newsletters reach only staff and these addresses or @domains:
EMAIL_TEST_MODE = "true"
# EMAIL_TEST_ALLOW = "@example.com"
# The postal address every newsletter footer carries:
# POSTAL_ADDRESS = "Example Inc., 1 Main St, Springfield, USA"
# A staging copy: every email is recorded as sent and none is delivered.
# EMAIL_DRY_RUN = "true"
# LINK_TAG = "ref=example.com"
# Default models for drafting and images; editors can change them in Settings, AI.
# TEXT_MODEL = "<model id>"
# IMAGE_MODEL = "<model id>"
# VIDEO_MODEL = "<model id>"          # the editor's "Generate a video"
# EMBEDDING_MODEL = "<model id>"      # lets the AI search the blog and your knowledge sources
# APP_URL = "https://masthead.<your-subdomain>.workers.dev/blog/"
# PREVIEW_PATH = "/blog-new/"
# Analytics (optional): your PostHog project key (public) and host.
# POSTHOG_KEY = "phc_..."
# POSTHOG_HOST = "https://us.i.posthog.com"
# Search Console in Analytics (optional): the property, as Search Console names it.
# GSC_PROPERTY = "sc-domain:example.com"
# Tell search engines about changes on publish, once SITE_URL serves this blog.
# INDEXNOW = "true"

# On a custom domain or a path of your site (docs/deploy.md):
# [[routes]]
# pattern = "example.com/blog*"
# zone_name = "example.com"

# Secrets (wrangler secret put <NAME>, or `wrangler deploy --secrets-file <file>`):
#   SECRET            random, 32+ characters: signs subscriber links
#   BOOTSTRAP_TOKEN   random, 32+ characters: the owner token, for the first sign-in and the CLI
#   RESEND_API_KEY    email
#   RESEND_WEBHOOK_SECRET  from the Resend webhook you point at <base>api/webhooks/email
#   PREDEV_API_KEY    AI (text, images, video, embeddings)
#   DENYLIST          optional: names post ideas never mention, newline or comma separated
#   POSTHOG_PERSONAL_API_KEY  optional: the admin's Analytics page (set POSTHOG_PROJECT_ID too)
#   GOOGLE_SERVICE_ACCOUNT    optional: Search Console in Analytics, a service account's JSON key (set GSC_PROPERTY too)
